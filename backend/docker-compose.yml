version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: musician_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-musician_db}
      POSTGRES_USER: ${POSTGRES_USER:-musician_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-musician_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  web:
    build: .
    container_name: musician_django
    restart: always
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - ./media:/app/media
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - DATABASE_URL=postgres://${POSTGRES_USER:-musician_user}:${POSTGRES_PASSWORD:-musician_password}@db:5432/${POSTGRES_DB:-musician_db}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
