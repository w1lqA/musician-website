name: Deploy Frontend

on:
  push:
    branches:
      - frontend
    paths:
      - 'frontend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Build project
      run: |
        cd frontend
        npm run build # Если тут упадет ошибка, деплой остановится автоматически!

    - name: Pack dist folder
      run: |
        cd frontend
        tar -czf ../deploy.tar.gz dist/

    - name: Setup SSH Key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.SERVER_SSH_KEY }}
        known_hosts: 'just-a-placeholder-for-now'
        if_key_exists: replace

    - name: Upload and Deploy to VPS
      run: |
        # 1. Создаем папку для ключа и записываем его из секретов GitHub
        mkdir -p ~/.ssh
        echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        
        # 2. Добавляем сервер в известные хосты
        ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
        
        # 3. Загружаем архив, принудительно указав созданный ключ через флаг -i
        scp -i ~/.ssh/id_ed25519 deploy.tar.gz ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}:/tmp/deploy.tar.gz
        
        # 4. Выполняем атомарное переключение, также явно указав ключ -i
        ssh -i ~/.ssh/id_ed25519 ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }} _TIMESTAMP=$(date +%Y%m%d%H%M%S) '
          mkdir -p /var/www/w1lq.shop_releases/$_TIMESTAMP
          tar -xzf /tmp/deploy.tar.gz -C /var/www/w1lq.shop_releases/$_TIMESTAMP --strip-components=1
          rm /tmp/deploy.tar.gz
          ln -sfn /var/www/w1lq.shop_releases/$_TIMESTAMP /var/www/w1lq.shop
          cd /var/www/w1lq.shop_releases && ls -t | tail -n +6 | xargs rm -rf 2>/dev/null || true
        '
