name: Deploy Frontend

on:
  push:
    branches:
      - frontend # Скрипт сработает при пуше в ветку frontend
    paths:
      - 'frontend/**' # Запуск только при изменениях внутри папки frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Build project
      run: |
        cd frontend
        npm run build # Если тут упадет ошибка сборки, деплой остановится!

    - name: Pack dist folder
      run: |
        cd frontend
        tar -czf ../deploy.tar.gz dist/

    - name: Upload dist to VPS
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        source: "deploy.tar.gz"
        target: "/tmp"

    - name: Execute Atomic Deploy on VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          _TIMESTAMP=$(date +%Y%m%d%H%M%S)
          mkdir -p /var/www/w1lq.shop_releases/$_TIMESTAMP
          tar -xzf /tmp/deploy.tar.gz -C /var/www/w1lq.shop_releases/$_TIMESTAMP --strip-components=1
          rm /tmp/deploy.tar.gz
          ln -sfn /var/www/w1lq.shop_releases/$_TIMESTAMP /var/www/w1lq.shop
          cd /var/www/w1lq.shop_releases && ls -t | tail -n +6 | xargs rm -rf 2>/dev/null || true
